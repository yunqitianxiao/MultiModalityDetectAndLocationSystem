# Nav2 巡航参数 —— 巡检小车 2 轮差速, Gazebo Harmonic 仿真
# ================================================================
# 适配点(与本工程 ros_gz_bridge / urdf / 地图一一对应):
#   机器人根链      -> base_link (urdf 无 base_footprint, 车轮是 base_link 子链)
#   odom 链         -> odom (gz DiffDrive 桥接 /odom; odom_tf 由 odom_tf_broadcaster 发 odom->base_link)
#   map 链          -> 由 launch 里 static_transform_publisher 发恒等 map->odom
#                        (机器人出生在世界原点, odom 亦按世界对齐, 故 map==odom, 无需 AMCL)
#   //laser frame   -> lidar_link (urdf lidar_link, 顶部 gpu_lidar)
#   scan topic      -> /scan (ros_gz_bridge 把 gz /lidar/points 的 LaserScan 桥到 /scan)
#   cmd_vel topic   -> /cmd_vel (velocity_smoother 输出, 桥回 gz DiffDrive)
#   占用地图        -> config/nav2/tunnel_map.pgm(.yaml)
#
# 运行前提: 先装 Nav2 包
#   sudo apt install ros-humble-nav2-bringup ros-humble-nav2-dwb-controller \
#                    ros-humble-nav2-regulated-pure-pursuit-controller \
#                    ros-humble-nav2-navfn-planner ros-humble-nav2-behaviors \
#                    ros-humble-nav2-velocity-smoother ros-humble-nav2-map-server
# 再: ros2 launch inspection_robot nav2_bringup.launch.py
# ================================================================

# ---------------- 全局/公共 TF 与尺寸 ----------------
# 圆形足迹半径: 小车宽约 0.5m(驱动轮 ±0.2), 取 0.3m 留轮胎/保险杠余量;
#               隧道内壁 y=±1.25, 足迹半径 0.3 剩余可行驶半宽 ~0.95m, 双侧置中间规划安全。
robot_radius: 0.30

# ---------------- map_server (占用栅格图) ----------------
map_server:
  ros__parameters:
    use_sim_time: True
    yaml_filename: /home/ylf/workspace/inspection_robot/config/nav2/tunnel_map.yaml

# ---------------- 全局/局部代价地图 (frame: map / odom) ----------------
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: True
      robot_radius: 0.30
      resolution: 0.05
      track_unknown_space: true
      update_frequency: 5.0
      publish_frequency: 3.0
      rolling_window: false
      # 全局代价地图跟随全局参考系 map, 不复用局部滤波
      plugins:
        - static_layer
        - obstacle_layer
        - inflation_layer
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        max_obstacle_height: 2.0
        # 用 2D 激光(非点云)建障碍层; scope 本工程 gpu_lidar 的 /scan
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 15.0
          raytrace_min_range: 0.0
          obstacle_max_range: 10.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.55
        cost_scaling_factor: 8.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: True
      robot_radius: 0.30
      resolution: 0.05
      track_unknown_space: true
      update_frequency: 5.0
      publish_frequency: 3.0
      rolling_window: true
      width: 6.0        # 局部窗口: 沿隧道 x 方向 6m, 足够看下一步
      height: 6.0
      origin_x: -3.0
      origin_y: -3.0
      plugins:
        - obstacle_layer
        - inflation_layer
        - voxel_layer
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        max_obstacle_height: 2.0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 15.0
          raytrace_min_range: 0.0
          obstacle_max_range: 10.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.55
        cost_scaling_factor: 8.0
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: False
        publish_voxel_map: False

# ---------------- 全局规划器 (NavFn) ----------------
planner_server:
  ros__parameters:
    use_sim_time: True
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

# ---------------- 局部控制器 (Regulated Pure Pursuit, 适合差速/低速) ----------------
controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      stateful: True
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.3
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 1.0
      transform_tolerance: 0.1
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_collision_detection: true
      allow_reversing: false

# ---------------- 行为节点 (退避/自旋/等待) ----------------
behavior_server:
  ros__parameters:
    use_sim_time: True
    local_costmap_topic: local_costmap/costmap
    global_costmap_topic: global_costmap/costmap
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
      simulation_time: 2.0
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"

# ---------------- BT 导航节点 (NavigateToPose / FollowPath 行为树) ----------------
bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    default_nav_to_pose_bt_xml: "navigate_to_pose_w_replanning_and_recovery.xml"
    default_nav_through_poses_bt_xml: "navigate_through_poses_w_replanning_and_recovery.xml"
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_is_navigation_goal_received_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expired_condition_bt_node
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node

# ---------------- 路径平滑 (可选, 与 RPP 配合) ----------------
smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["Smoother"]
    Smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      max_iterations: 1000
      tolerance: 1e-6
      do_velocity_checking: True
      lambda_vel: 0.0
      min_angle_change: 0.5
      max_angle_change: 2.0
      use_quadratic: True
      max_time: 0.5
      w_xy: 5.0
      w_v: 0.1
      w_ya: 0.0
      w_obs: 0.1
      w_grad: 0.2
      w_kin: 20.0
      w_est: 0.0
      debug_orient: False
      max_deviation_kin: 2.0

# ---------------- 速度平滑器 (把控制器 cmd_vel 限速后发 /cmd_vel) ----------------
velocity_smoother:
  ros__parameters:
    use_sim_time: True
    max_velocities: [0.30, 0.0, 0.6]    # vx, vy, wz (差速 vy 恒 0)
    min_velocities: [-0.1, 0.0, -0.6]
    max_accel: [0.5, 0.0, 0.4]
    min_accel: [-0.5, 0.0, -0.4]
    max_decel: [-0.5, 0.0, -0.4]
    min_decel: [0.5, 0.0, 0.4]
    odom_topic: /odom
    odom_duration: 0.1
    velocity_offset: [0.0, 0.0, 0.0]
    feedback: "ODOM"

# ---------------- 循环式路点跟随器 (跟一串路点巡航) ----------------
waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    follow_frequency: 1.5
    stop_on_failure: False
